name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: KeyboardFrequencyMonitor.exe
            # -H windowsgui 隐藏控制台窗口，仅 Windows 需要
            ldflags: -s -w -H windowsgui
            cgo: 0
          - os: macos-latest
            name: KeyboardFrequencyMonitor-macos
            # macOS 的 CGEventTap 与菜单栏图标都走 cgo，不能关
            ldflags: -s -w
            cgo: 1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # unsafeptr 检查对 Win32 钩子回调的标准写法误报，见 recorder_windows.go 注释
      - name: Vet
        run: go vet -unsafeptr=false ./...

      - name: Build
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go build -trimpath -ldflags "${{ matrix.ldflags }}" -o ${{ matrix.name }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}
