name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # unsafeptr 检查对 Win32 钩子回调的标准写法误报，见 recorder.go 注释
      - name: Vet
        run: go vet -unsafeptr=false ./...

      - name: Test
        run: go test ./...

      # 自包含测试套件（tests/ 内全部单元 + 黑盒端到端测试）
      - name: Tests (tests/)
        working-directory: tests
        run: |
          ./sync.sh
          go vet -unsafeptr=false ./...
          go test ./...

      - name: Build
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o KeyboardFrequencyMonitor.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardFrequencyMonitor
          path: KeyboardFrequencyMonitor.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: KeyboardFrequencyMonitor.exe
