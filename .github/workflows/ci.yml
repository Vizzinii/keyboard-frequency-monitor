name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: KeyboardFrequencyMonitor.exe
          - os: macos-latest
            name: KeyboardFrequencyMonitor-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # unsafeptr 检查对 Win32 钩子回调的标准写法误报，见 recorder_windows.go 注释
      - name: Vet
        run: go vet -unsafeptr=false ./...

      - name: Test
        run: go test ./...

      # macOS 的 CGEventTap 与菜单栏图标走 cgo，不能关；
      # 分别编 amd64/arm64 再用 lipo 合成 universal，Intel Mac 也能跑
      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          CGO_ENABLED=1 GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o kfm-amd64 .
          CGO_ENABLED=1 GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o kfm-arm64 .
          lipo -create -output "${{ matrix.name }}" kfm-amd64 kfm-arm64
          lipo -archs "${{ matrix.name }}"

      # -H windowsgui 隐藏控制台窗口，仅 Windows 需要
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o ${{ matrix.name }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}
