<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>键盘使用统计</title>
<style>
  :root {
    --bg: #12151b; --card: #1a2028; --line: #2a3340;
    --text: #d8dee8; --dim: #7d8896;
    --accent: 79, 140, 255;          /* 热力图基色 RGB */
    --accent-solid: #4f8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
    padding: 14px 22px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--bg); z-index: 5;
  }
  header h1 { font-size: 17px; margin: 0 auto 0 0; }
  #total { color: var(--dim); font-size: 13px; }
  #total b { color: var(--text); font-size: 15px; }
  .ranges button {
    background: none; border: 1px solid var(--line); color: var(--dim);
    padding: 4px 14px; border-radius: 16px; cursor: pointer; font-size: 13px;
  }
  .ranges button.on { border-color: var(--accent-solid); color: #fff; background: rgba(var(--accent), .18); }
  main { max-width: 1080px; margin: 0 auto; padding: 18px 22px 40px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px 18px; margin-bottom: 16px;
  }
  .card h2 { font-size: 13px; color: var(--dim); margin: 0 0 12px; font-weight: 600; }
  .two-col { display: grid; grid-template-columns: 5fr 4fr; gap: 16px; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }

  /* ---- 键盘热力图 ---- */
  #kb { display: flex; flex-direction: column; gap: 5px; }
  .krow { display: flex; gap: 5px; }
  .key {
    flex: var(--u) var(--u) 0; min-width: 0; height: 46px;
    border-radius: 6px; border: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden; user-select: none;
  }
  .key .cap { font-size: 11.5px; color: var(--dim); white-space: nowrap; }
  .key .n   { font-size: 10.5px; color: #eaf1ff; opacity: .92; }
  .key.lit  { border-color: transparent; }
  .key.lit .cap { color: #cfd9ea; }

  /* ---- 排行 ---- */
  .rankrow { display: grid; grid-template-columns: 74px 64px 52px 1fr; align-items: center;
             gap: 8px; padding: 2.5px 0; font-variant-numeric: tabular-nums; }
  .rankrow .name { text-align: right; color: var(--text); overflow: hidden; text-overflow: ellipsis; }
  .rankrow .cnt  { text-align: right; color: var(--dim); }
  .rankrow .pct  { text-align: right; color: var(--dim); font-size: 12px; }
  .rankrow .bar  { height: 13px; border-radius: 3px; background: rgba(var(--accent), .75); min-width: 2px; }
  .bar-track { height: 13px; position: relative; }

  /* ---- 趋势 / 时段 ---- */
  .chart { display: flex; align-items: flex-end; gap: 6px; height: 120px; }
  .chart.slim { height: 90px; gap: 4px; }
  .col { flex: 1 1 0; display: flex; flex-direction: column; justify-content: flex-end;
         align-items: center; gap: 4px; height: 100%; min-width: 0; }
  .col .v { height: var(--h); width: 100%; max-width: 34px; border-radius: 3px 3px 0 0;
            background: linear-gradient(180deg, rgba(var(--accent),.95), rgba(var(--accent),.45)); }
  .col.zero .v { background: var(--line); }
  .col .l { font-size: 10px; color: var(--dim); white-space: nowrap; }
  #err { display: none; color: #ff8f8f; padding: 8px 22px; }
  footer { color: var(--dim); font-size: 12px; text-align: center; padding-bottom: 26px; }
</style>
</head>
<body>
<header>
  <h1>⌨ 键盘使用统计</h1>
  <div class="ranges">
    <button data-r="today">今天</button>
    <button data-r="week" class="on">近 7 天</button>
    <button data-r="all">全部</button>
  </div>
  <div id="total">加载中…</div>
</header>
<div id="err">无法连接本地记录程序 —— 请确认 key_monitor.py 正在运行。</div>

<main>
  <section class="card">
    <h2>键位热力图（色块越亮按得越多）</h2>
    <div id="kb"></div>
    <div id="rest" style="margin-top:10px;color:var(--dim);font-size:12px"></div>
  </section>
  <div class="two-col">
    <section class="card">
      <h2>使用排行 Top 15</h2>
      <div id="rank"></div>
    </section>
    <section class="card">
      <h2>每日趋势（近 14 天）</h2>
      <div class="chart" id="days"></div>
      <h2 style="margin-top:18px">时段分布（按小时）</h2>
      <div class="chart slim" id="hours"></div>
    </section>
  </div>
</main>
<footer id="foot">数据每 2 秒自动刷新 · 只在本机保存，仅监听 127.0.0.1</footer>

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
                          .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const fmt = n => n.toLocaleString("en-US");

// 物理键盘布局：[键帽文字, 对应的统计键名数组, 宽度单位]
const K = (t,n,u=1)=>[t,[n],u];
const LAYOUT = [
  [K("Esc","esc"), ...["f1","f2","f3","f4","f5","f6","f7","f8","f9","f10","f11","f12"]
      .map(n=>K(n.toUpperCase(),n))],
  [K("`","`"), ...["1","2","3","4","5","6","7","8","9","0","-","="].map(n=>K(n,n)),
   K("⌫ Delete","backspace",2)],
  [K("Tab","tab",1.5),
   ...["q","w","e","r","t","y","u","i","o","p","[","]"].map(n=>K(n.toUpperCase(),n)),
   K("\\","\\",1.5)],
  [K("Caps","caps_lock",1.75),
   ...["a","s","d","f","g","h","j","k","l",";","'"].map(n=>K(n.toUpperCase(),n)),
   K("⏎ Enter","enter",2.25)],
  [K("Shift","shift",2.25),
   ...["z","x","c","v","b","n","m",",",".","/"].map(n=>K(n.toUpperCase(),n)),
   K("Shift","shift_r",2.75)],
  [K("Ctrl","ctrl",1.25),K("Win","cmd",1.25),K("Alt","alt",1.25),K("Space","space",6.25),
   K("Alt","alt_r",1.25),K("Win","cmd_r",1.25),K("☰","menu",1.25),K("Ctrl","ctrl_r",1.25)],
];

let cur = "week";

function render(d) {
  const map = Object.fromEntries(d.keys);
  const max = d.keys.length ? d.keys[0][1] : 0;

  // 热力图
  const shown = new Set();
  let html = "";
  for (const row of LAYOUT) {
    html += '<div class="krow">';
    for (const [cap, names, u] of row) {
      const c = names.reduce((s,n)=> s + (map[n]||0), 0);
      names.forEach(n=>shown.add(n));
      const lit = c > 0 && max > 0;
      const a = lit ? (.12 + .88 * Math.pow(c / max, .55)).toFixed(3) : 0;
      html += `<div class="key${lit?" lit":""}" style="--u:${u}${lit?`;background:rgba(79,140,255,${a})`:""}" title="${esc(names.join("/"))}: ${fmt(c)} 次">`
            + `<span class="cap">${esc(cap)}</span>`
            + (lit ? `<span class="n">${fmt(c)}</span>` : "")
            + "</div>";
    }
    html += "</div>";
  }
  $("kb").innerHTML = html;

  // 布局上没画的键，汇总一行
  let rest = 0, restKinds = 0;
  for (const [n,c] of d.keys) if (!shown.has(n)) { rest += c; restKinds++; }
  $("rest").textContent = d.total
    ? `布局未画出的其它键（方向键、F 区以外、小键盘等 ${restKinds} 种）共 ${fmt(rest)} 次（${(rest/d.total*100).toFixed(1)}%）`
    : "";

  // 排行
  const top = d.keys.slice(0, 15);
  $("rank").innerHTML = top.length ? top.map(([n,c]) => {
    const w = (c / (top[0][1]||1) * 100).toFixed(1);
    return `<div class="rankrow" title="${esc(n)}">
      <span class="name">${esc(n)}</span><span class="cnt">${fmt(c)}</span>
      <span class="pct">${d.total ? (c/d.total*100).toFixed(1)+"%" : "-"}</span>
      <div class="bar-track"><div class="bar" style="width:${w}%"></div></div></div>`;
  }).join("") : `<div style="color:var(--dim)">该范围内暂无数据</div>`;

  // 每日趋势
  const dmax = Math.max(...d.days.map(x=>x[1]), 1);
  $("days").innerHTML = d.days.map(([day,c]) =>
    `<div class="col${c?"":" zero"}" title="${day}：${fmt(c)} 次">
       <div class="v" style="--h:${Math.max(c/dmax*100, 3)}%"></div>
       <span class="l">${day.slice(5)}</span></div>`).join("");

  // 时段分布
  const hmax = Math.max(...d.hours, 1);
  $("hours").innerHTML = d.hours.map((c,h) =>
    `<div class="col${c?"":" zero"}" title="${h} 点～${h+1} 点：${fmt(c)} 次">
       <div class="v" style="--h:${Math.max(c/hmax*100, 3)}%"></div>
       <span class="l">${h%3===0 ? h : ""}</span></div>`).join("");

  // 顶部合计
  const since = d.since ? ` · 记录自 ${d.since}` : "";
  $("total").innerHTML =
    `${{today:"今天",week:"近 7 天",all:"全部"}[cur]}共 <b>${fmt(d.total)}</b> 次` +
    `（${fmt(d.distinct)} 种键）${since} · 更新于 ${d.now}`;
}

async function load() {
  try {
    const r = await fetch("/api/stats?range=" + cur, {cache: "no-store"});
    render(await r.json());
    $("err").style.display = "none";
  } catch (e) {
    $("err").style.display = "block";
  }
}

document.querySelectorAll(".ranges button").forEach(b => {
  b.onclick = () => {
    cur = b.dataset.r;
    document.querySelectorAll(".ranges button").forEach(x => x.classList.toggle("on", x === b));
    load();
  };
});
load();
setInterval(load, 2000);
</script>
</body>
</html>
